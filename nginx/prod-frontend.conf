upstream sseclient_backend {
    server 127.0.0.1:8005;
    keepalive 32;
}

server {
    listen 3000;
    server_name localhost;
    client_max_body_size 100m;

    # 静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # LLM 推理专用：长超时
    location /dev-api/v1/chat/completions {
        proxy_pass http://sseclient_backend/v1/chat/completions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    # 前端轮询接口（result/mobile-agent 等）：不用 upstream keepalive 复用，
    # 每个请求新建连接。原因：8005 tcp_forwarder 是单线程同步转发，
    # 复用连接会被慢连接卡死 → nginx recv() failed (104) → 502。
    location ~ ^/dev-api/(?<pollpath>result/.*|mobile-agent/.*|test_list.*|mobile/.*) {
        proxy_pass http://127.0.0.1:8005/$pollpath;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # 反向代理 /dev-api/
    location /dev-api/ {
        proxy_pass http://sseclient_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_buffering off;
    }

    # 反向代理 /record-api/
    location /record-api/ {
        proxy_pass http://sseclient_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_buffering off;
    }
}
